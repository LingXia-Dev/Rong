version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /packages/rong_types
    schedule:
      interval: monthly
    groups:
      rong-types-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
