name: Spike Intl on ICU4X

on:
  push:
    branches: [spike/intl-icu4x]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  SPIKE: spike/intl-icu4x

jobs:
  size-linux-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Build baseline and ICU4X probe
        working-directory: ${{ env.SPIKE }}
        run: |
          set -eu
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$ndk/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk/llvm-ar"
          for t in x86_64-unknown-linux-gnu aarch64-linux-android; do
            cargo build --release --lib --target "$t" --target-dir "base"
            cargo build --release --lib --target "$t" --target-dir "icu" --features blob
            b=$(stat -c %s "base/$t/release/libintl_icu4x_spike.so")
            i=$(stat -c %s "icu/$t/release/libintl_icu4x_spike.so")
            bz=$(gzip -9c "base/$t/release/libintl_icu4x_spike.so" | wc -c)
            iz=$(gzip -9c "icu/$t/release/libintl_icu4x_spike.so" | wc -c)
            echo "SIZE $t baseline $b bytes (gzip $bz); with ICU4X $i bytes (gzip $iz); added $((i-b)) bytes (gzip $((iz-bz)))"
          done

  size-apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - name: Build baseline and ICU4X probe
        working-directory: ${{ env.SPIKE }}
        run: |
          set -eu
          for t in aarch64-apple-darwin aarch64-apple-ios; do
            cargo build --release --lib --target "$t" --target-dir "base"
            cargo build --release --lib --target "$t" --target-dir "icu" --features blob
            b=$(stat -f %z "base/$t/release/libintl_icu4x_spike.dylib")
            i=$(stat -f %z "icu/$t/release/libintl_icu4x_spike.dylib")
            echo "SIZE $t baseline $b bytes; with ICU4X $i bytes; added $((i-b)) bytes"
          done

  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install icu4x-datagen
        run: cargo install icu4x-datagen --version =2.4.0 --locked --features unstable
      - name: Build the probe with and without Collator (markers are read from it)
        working-directory: ${{ env.SPIKE }}
        run: |
          set -eu
          cargo build --release --lib --features blob
          cp target/release/libintl_icu4x_spike.so lib-nocoll.so
          cargo build --release --lib --features collator
          cp target/release/libintl_icu4x_spike.so lib-coll.so
      - name: Blob per locale for the probe's markers
        working-directory: ${{ env.SPIKE }}
        run: |
          set -eu
          mkdir -p blobs
          gen() {
            lib=$1; name=$2; shift 2
            icu4x-datagen --markers-for-bin "$lib.so" --format blob --out "blobs/$lib-$name.postcard" --locales "$@" >/dev/null 2>"blobs/$lib-$name.log" || { echo "DATAGEN $lib $name failed"; tail -5 "blobs/$lib-$name.log"; return 0; }
            s=$(stat -c %s "blobs/$lib-$name.postcard"); z=$(gzip -9c "blobs/$lib-$name.postcard" | wc -c)
            echo "BLOB $lib $name $s bytes (gzip $z)"
          }
          for lib in lib-coll lib-nocoll; do
            gen $lib none none
            for l in en en-US en-001 zh-Hans he es ar ja; do gen $lib "$l" "$l"; done
            gen $lib en-US-he-es en-US he es
            gen $lib modern modern
          done
          # Which locales an `en` request exports, per marker.
          for l in en en-US; do
            icu4x-datagen --markers-for-bin lib-nocoll.so --format fs --syntax postcard --out "tree-$l" --locales "$l" >/dev/null 2>&1 || echo "TREE $l failed"
            for m in $(find "tree-$l" -mindepth 1 -maxdepth 3 -type d | sort); do
              n=$(find "$m" -maxdepth 1 -type f | wc -l)
              if [ "$n" -gt 0 ]; then echo "LOCALES $l $(du -sb "$m" | cut -f1) ${m#tree-$l/}: $(find "$m" -maxdepth 1 -type f -printf '%f ' | sed 's/\.postcard//g' | head -c 600)"; fi
            done
          done
          cp lib-coll.so target/release/libintl_icu4x_spike.so
          for f in blobs/lib-coll-*.postcard; do n=${f#blobs/lib-coll-}; cp "$f" "blobs/$n"; done
          cp blobs/lib-coll-en-US-he-es.postcard blobs/en-he-es.postcard
      - name: Load a per-locale blob at run time
        working-directory: ${{ env.SPIKE }}
        run: |
          set -eu
          cat > load.py <<'EOF'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.intl_probe.argtypes = [ctypes.c_char_p, ctypes.c_size_t, ctypes.c_char_p, ctypes.c_size_t, ctypes.c_char_p, ctypes.c_size_t]
          lib.intl_probe.restype = ctypes.c_size_t
          for name, loc in [("en", "en-US"), ("he", "he"), ("es", "es"), ("zh-Hans", "zh-Hans"), ("ar", "ar"), ("ja", "ja"), ("en-he-es", "he")]:
              blob = open(f"blobs/{name}.postcard", "rb").read()
              out = ctypes.create_string_buffer(4096)
              n = lib.intl_probe(blob, len(blob), loc.encode(), len(loc.encode()), out, 4096)
              print("LOAD", name, loc, out.raw[:n].decode("utf-8", "replace"))
          EOF
          python3 load.py target/release/libintl_icu4x_spike.so

  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: toLocaleString through rong on QuickJS
        working-directory: ${{ env.SPIKE }}
        run: |
          cargo run --release --features bridge --bin bridge
          cargo run --release --features bridge --bin bridge

  parity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        icu: ["2.4.0", "2.2.0"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: ICU4X against the CLDR 48 / ICU 78.2 table
        working-directory: ${{ env.SPIKE }}
        run: |
          set -eu
          sed -i 's/"=2.4.0"/"=${{ matrix.icu }}"/' Cargo.toml
          echo "ICU4X ${{ matrix.icu }}"
          cargo run --release --features parity --bin parity -- cases-cldr48.json
