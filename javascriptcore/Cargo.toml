[package]
name = "rong_jscore"
version = "0.5.1"
edition.workspace = true

description = "JavaScriptCore backend for RongJS"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rong_jscore"
readme = "README.md"
[features]
# Source/JSCOnly builds always enable engine preemption. The private-SPI caveat
# only applies when linking Apple's system JavaScriptCore framework.
source = ["rong_jscore_sys/source", "interrupt-spi"]
# Engine preemption via the execution-time-limit SPI (JSContextRefPrivate.h).
# System-framework consumers opt in because the header is private on iOS;
# source builds enable this automatically.
interrupt-spi = []

[dependencies]
rong_jscore_sys = { workspace = true }
rong_core = { workspace = true }
smallvec = { workspace = true }
