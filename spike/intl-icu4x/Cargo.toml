[package]
name = "intl_icu4x_spike"
version = "0.0.0"
edition = "2024"
publish = false

# Measures ICU4X for an Intl implementation; not part of the rong workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "parity"
required-features = ["parity"]

[[bin]]
name = "locale_markers"
required-features = ["blob"]

[[bin]]
name = "bridge"
required-features = ["bridge"]

[features]
default = []
# Links the first-cut components, reading data from a blob at run time.
blob = ["dep:icu", "dep:icu_provider_blob", "dep:icu_provider", "dep:icu_provider_adapters"]
# Adds Collator to the blob build, to measure collation data on its own.
collator = ["blob"]
# rong on QuickJS with a cached ICU4X formatter behind toLocaleString.
bridge = ["dep:icu", "icu/compiled_data", "dep:fixed_decimal", "dep:rong"]
# Compiled-in data for every locale, for the parity run.
parity = ["dep:icu", "icu/compiled_data", "dep:serde_json", "dep:fixed_decimal"]

[dependencies]
icu = { version = "=2.4.0", default-features = false, features = ["serde", "unstable"], optional = true }
icu_provider_blob = { version = "=2.4.0", features = ["alloc"], optional = true }
icu_provider = { version = "=2.4.0", features = ["serde"], optional = true }
icu_provider_adapters = { version = "=2.4.0", optional = true }
serde_json = { version = "1", optional = true }
fixed_decimal = { version = "0.7", features = ["ryu"], optional = true }
rong = { path = "../..", default-features = false, features = ["quickjs", "tls-ring"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
