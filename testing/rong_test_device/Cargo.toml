[package]
name = "rong_test_device"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "On-device test suite generated from tests/*.rs via build.rs source transformation"

[features]
default = ["jsvm", "intl"]
jsvm = []
intl = ["rong/intl"]
tls-aws-lc = ["rong/tls-aws-lc"]
tls-ring = ["rong/tls-ring"]

[dependencies]
rong_test_harness = { workspace = true }

[build-dependencies]
regex = "1"

[target.'cfg(target_env = "ohos")'.dependencies]
rong = { workspace = true, default-features = false, features = ["jsvm"] }
rong_test = { workspace = true, features = ["jsvm"] }
rong_macro = { workspace = true }
rong_jsvm_sys = { workspace = true }
rong_core = { workspace = true }
rong_jsvm = { workspace = true }
log = "0.4"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
futures = { workspace = true }
bytes = { workspace = true }
