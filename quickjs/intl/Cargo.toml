[package]
name = "rong_quickjs_intl"
version = "0.8.0"
edition.workspace = true

description = "ECMA-402 Intl for RongJS on QuickJS; internal to rong_quickjs, use rong::quickjs::intl"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rong"
readme = "README.md"

[dependencies]
rong_core = { workspace = true }
icu = { version = "=2.4.0", default-features = false, features = ["serde"] }
icu_provider = { version = "2.4", default-features = false, features = ["serde"] }
icu_provider_blob = { version = "2.4", default-features = false, features = ["alloc"] }
# For `CompactDecimalFormatter`, which knows where a locale's compact exponents fall.
icu_decimal = { version = "=2.4.0", default-features = false, features = ["alloc", "serde", "unstable"] }
# For `PluralRulesWithRanges` (selectRange).
icu_plurals = { version = "=2.4.0", default-features = false, features = ["serde", "unstable"] }
fixed_decimal = { version = "0.7.3", default-features = false }
# Percent (and later currency and unit) data. Pre-1.0, so pinned exactly;
# the README lists the data markers used.
icu_experimental = { version = "=0.7.0", default-features = false, features = ["serde"] }
tinystr = { version = "0.8", default-features = false }
icu_pattern = { version = "=0.5.1", default-features = false, features = ["alloc", "yoke", "zerovec"] }
log = "0.4"
# DateTimeFormat: `fieldbag` (ECMA-402's component options to ICU4X field sets)
# is unstable in ICU4X 2.4, which `icu` pins exactly.
icu_datetime = { version = "=2.4.0", default-features = false, features = ["serde", "unstable"] }
writeable = { version = "0.6", default-features = false }
# To rebuild the range patterns ICU4X loads (date_range.rs).
zerovec = { version = "0.11", default-features = false, features = ["alloc"] }
zerofrom = { version = "0.1", default-features = false }
rong_quickjs_tz = { workspace = true }

[features]
# The tz database copy on Android and HarmonyOS (207 KB), used when the
# system's cannot answer; see rong_quickjs_tz's `bundled`.
bundled-tzdb = ["rong_quickjs_tz/bundled"]

# Tests pick their engine and TLS backend through `rong`, such as
# `--features rong/quickjs,rong/tls-ring` (or `rong/jscore`, the reference).
# The crate itself is engine-generic: its one feature is the tz copy above.
[dev-dependencies]
rong = { workspace = true }
rong_test = { path = "../../testing/rong_test" }
