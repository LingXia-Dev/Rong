[package]
name = "rong_quickjs"
version = "0.8.0"
edition.workspace = true

description = "QuickJS backend for RongJS"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rong_quickjs"
readme = "README.md"
[dependencies]
rong_quickjs_sys = { workspace = true }
rong_core = { workspace = true }
rong_quickjs_intl = { workspace = true, optional = true }
smallvec = { workspace = true }

[features]
default = []
# ECMA-402 `Intl` as `rong_quickjs::intl`; off by default. Pulls in ICU4X.
intl = ["dep:rong_quickjs_intl"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
