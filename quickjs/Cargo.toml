[package]
name = "rong_quickjs"
version = "0.8.0"
edition.workspace = true

description = "QuickJS backend for RongJS"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rong_quickjs"
readme = "README.md"
[dependencies]
rong_quickjs_sys = { workspace = true }
rong_core = { workspace = true }
rong_intl = { workspace = true, optional = true }
rong_quickjs_jit = { workspace = true, optional = true }
smallvec = { workspace = true }

[features]
default = []
# Installs rong's ECMA-402 `Intl` (`rong_intl`) with `rong_quickjs::intl::init`;
# off by default. Pulls in ICU4X.
intl = ["dep:rong_intl"]
# Cranelift baseline JIT compiler as `rong_quickjs::jit`; off by default.
jit = ["dep:rong_quickjs_jit", "rong_quickjs_sys/jit"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
